global:
  environment: dev

storefront-ui:
  enabled: true
  image:
    tag: main
storefront-bff:
  enabled: true
  image:
    tag: main
  env:
    SPRING_PROFILES_ACTIVE: "custom"
    SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://storefront-ui:3000"
    SPRING_APPLICATION_JSON: >-
      {"spring":{"cloud":{"gateway":{"routes":[{"id":"api_servicename_local","uri":"http://api.yas.local","predicates":["Path=/api/servicename/**"],"filters":["TokenRelay","StripPrefix=1"]},{"id":"api","uri":"http://api.yas.local","predicates":["Path=/api/**"],"filters":["TokenRelay","StripPrefix=1"]},{"id":"nextjs","uri":"http://storefront-ui:3000","predicates":["Path=/**"]}]}}}}
backoffice-ui:
  enabled: true
  image:
    tag: main
backoffice-bff:
  enabled: true
  image:
    tag: main
  env:
    SPRING_APPLICATION_JSON: >-
      {"spring":{"cloud":{"gateway":{"routes":[{"id":"api_servicename_local","uri":"http://api.yas.local","predicates":["Path=/api/servicename/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay"]},{"id":"api","uri":"http://api.yas.local","predicates":["Path=/api/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay"]},{"id":"nextjs","uri":"http://backoffice-ui:3000","predicates":["Path=/**"]}]}}}}
product:
  enabled: true
  image:
    tag: main
media:
  enabled: true
  image:
    tag: main
customer:
  enabled: true
  image:
    tag: main
cart:
  enabled: true
  image:
    tag: main
order:
  enabled: true
  image:
    tag: main
inventory:
  enabled: true
  image:
    tag: main
