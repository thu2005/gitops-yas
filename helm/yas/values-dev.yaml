global:
  environment: dev

istio:
  enabled: true  # Istio da cai tren GKE cluster yas-dev

storefront-ui:
  enabled: true
  image:
    tag: main
  env:
    API_BASE_PATH: "http://storefront-bff/api"
storefront-bff:
  enabled: true
  image:
    tag: main
  env:
    SPRING_PROFILES_ACTIVE: "custom"
    SPRING_APPLICATION_JSON: >-
      {"spring":{"cloud":{"gateway":{"server":{"webflux":{"default-filters":["SaveSession"],"routes":[{"id":"product_api","uri":"http://product","predicates":["Path=/api/product/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"cart_api","uri":"http://cart","predicates":["Path=/api/cart/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"customer_api","uri":"http://customer","predicates":["Path=/api/customer/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"order_api","uri":"http://order","predicates":["Path=/api/order/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"tax_api","uri":"http://tax","predicates":["Path=/api/tax/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"inventory_api","uri":"http://inventory","predicates":["Path=/api/inventory/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"media_api","uri":"http://media","predicates":["Path=/api/media/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"search_api","uri":"http://search","predicates":["Path=/api/search/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"sampledata_api","uri":"http://sampledata","predicates":["Path=/api/sampledata/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"nextjs","uri":"http://storefront-ui:3000","predicates":["Path=/**"]}]}}}}}}
backoffice-ui:
  enabled: true
  image:
    tag: main
  env:
    API_BASE_PATH: "http://backoffice-bff/api"
backoffice-bff:
  enabled: true
  image:
    tag: main
  env:
    SPRING_PROFILES_ACTIVE: "custom"
    SPRING_APPLICATION_JSON: >-
      {"spring":{"cloud":{"gateway":{"server":{"webflux":{"default-filters":["SaveSession"],"routes":[{"id":"product_api","uri":"http://product","predicates":["Path=/api/product/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"customer_api","uri":"http://customer","predicates":["Path=/api/customer/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"order_api","uri":"http://order","predicates":["Path=/api/order/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"tax_api","uri":"http://tax","predicates":["Path=/api/tax/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"inventory_api","uri":"http://inventory","predicates":["Path=/api/inventory/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"media_api","uri":"http://media","predicates":["Path=/api/media/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"search_api","uri":"http://search","predicates":["Path=/api/search/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"nextjs","uri":"http://backoffice-ui:3000","predicates":["Path=/**"]}]}}}}}}
product:
  enabled: true
  image:
    tag: main
media:
  enabled: true
  image:
    tag: main
  env:
    YAS_PUBLICURL: "/api/media"
customer:
  enabled: true
  image:
    tag: main
cart:
  enabled: true
  image:
    tag: main
order:
  enabled: true
  image:
    tag: main
inventory:
  enabled: true
  image:
    tag: main
tax:
  enabled: true
  image:
    tag: 2094d996
search:
  enabled: true
  image:
    tag: main
sampledata:
  enabled: true
  image:
    tag: main
  env:
    SPRING_DATASOURCE_PRODUCT_URL: "jdbc:postgresql://postgresql.postgres:5432/product"
    SPRING_DATASOURCE_MEDIA_URL: "jdbc:postgresql://postgresql.postgres:5432/media"
swagger-ui:
  enabled: true
  image:
    tag: v5.17.14
