storefrontBffExtraConfig:
  spring:
    security:
      oauth2:
        client:
          provider:
            keycloak:
              issuer-uri: "http://identity/realms/Yas"
          registration:
            keycloak:
              client-id: storefront-bff
              client-secret: ${KEYCLOAK_STOREFRONT_BFF_CLIENT_SECRET}
              scope:
                - openid
                - profile
                - email
                - roles

