global:
  environment: staging
  domainPrefix: "staging-"
  configRevision: "staging-domain-fix-1"

istio:
  enabled: true  # Istio đã cài trên GKE cluster

storefront-ui:
  enabled: true
  replicaCount: 1
  image:
    tag: main
  service:
    type: ClusterIP
    port: 3000
    nodePort: null
  env:
    API_BASE_PATH: "http://storefront-bff/api"

storefront-bff:
  enabled: true
  replicaCount: 1
  image:
    tag: main
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  podAnnotations:
    instrumentation.opentelemetry.io/inject-java: "true"
    rollout.yas.dev/payment-route: "098c4f6"
  hostAliases:
    - hostnames:
        - identity.yas.local
      ip: 34.118.234.132
  env:
    OTEL_TRACES_EXPORTER: "otlp"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"
    SPRING_PROFILES_ACTIVE: "custom"
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: "http://identity.yas.local/realms/Yas"
    YAS_SERVICES_TOKEN_IDENTITY: "http://identity.yas.local/realms/Yas/protocol/openid-connect/token"
    SPRING_APPLICATION_JSON: '{"spring":{"cloud":{"gateway":{"server":{"webflux":{"default-filters":["SaveSession"],"routes":[{"id":"product_api","uri":"http://product","predicates":["Path=/api/product/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"cart_api","uri":"http://cart","predicates":["Path=/api/cart/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"customer_api","uri":"http://customer","predicates":["Path=/api/customer/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"order_api","uri":"http://order","predicates":["Path=/api/order/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"tax_api","uri":"http://tax","predicates":["Path=/api/tax/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"inventory_api","uri":"http://inventory","predicates":["Path=/api/inventory/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"media_api","uri":"http://media","predicates":["Path=/api/media/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"location_api","uri":"http://location","predicates":["Path=/api/location/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"payment_api","uri":"http://payment","predicates":["Path=/api/payment/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}","TokenRelay="]},{"id":"search_api","uri":"http://search","predicates":["Path=/api/search/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"sampledata_api","uri":"http://sampledata","predicates":["Path=/api/sampledata/**"],"filters":["RewritePath=/api/(?<segment>.*), /${segment}"]},{"id":"nextjs","uri":"http://storefront-ui:3000","predicates":["Path=/**"]}]}}}}}}'

