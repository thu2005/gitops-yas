{{- if .Values.istio.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: yas-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: yas-web
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ default "" .Values.global.domainPrefix }}storefront.yas.local
    - {{ default "" .Values.global.domainPrefix }}backoffice.yas.local
    - {{ default "" .Values.global.domainPrefix }}swagger.yas.local
  gateways:
    - yas-gateway
  http:
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}storefront\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /api
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}storefront\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /oauth2
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}storefront\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /login
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}storefront\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /logout
      route:
        - destination:
            host: storefront-bff.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}storefront\\.yas\\.local(:[0-9]+)?$'
      route:
        - destination:
            host: storefront-ui.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 3000
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}backoffice\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /api
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}backoffice\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /oauth2
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}backoffice\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /login
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}backoffice\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /logout
      route:
        - destination:
            host: backoffice-bff.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}backoffice\\.yas\\.local(:[0-9]+)?$'
      route:
        - destination:
            host: backoffice-ui.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 3000
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}swagger\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /product
      route:
        - destination:
            host: product.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}swagger\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /media
      route:
        - destination:
            host: media.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
