            regex: '^{{ default "" .Values.global.domainPrefix }}swagger\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /customer
      route:
        - destination:
            host: customer.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}swagger\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /cart
      route:
        - destination:
            host: cart.{{ .Release.Namespace }}.svc.cluster.local
