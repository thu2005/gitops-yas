          uri:
            prefix: /order
      route:
        - destination:
            host: order.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}swagger\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /payment
      route:
        - destination:
            host: payment.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            regex: '^{{ default "" .Values.global.domainPrefix }}swagger\\.yas\\.local(:[0-9]+)?$'
          uri:
            prefix: /location
      route:
        - destination:
            host: location.{{ .Release.Namespace }}.svc.cluster.local
            port:
