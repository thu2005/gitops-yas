{{- if .Values.istio.enabled }}
---
# Allow Istio ingressgateway to call public BFF and UI workloads.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-storefront-bff
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: storefront-bff
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-backoffice-bff
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: backoffice-bff
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-storefront-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: storefront-ui
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-backoffice-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: backoffice-ui
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-swagger-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: swagger-ui
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
# Allow storefront-bff and backoffice-bff to call product.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-bffs-to-product
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: product
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/cart"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/order"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/search"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/inventory"
---
# Allow storefront-bff to call cart.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-storefront-bff-to-cart
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: cart
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/order"
---
# Allow storefront-bff and backoffice-bff to call customer.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-bffs-to-customer
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: customer
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/order"
---
# Allow storefront-bff and backoffice-bff to call order.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-bffs-to-order
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: order
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/payment"
---
# Allow storefront-bff to call payment during checkout.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-storefront-bff-to-payment
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: payment
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
---
# Allow order, storefront-bff, and backoffice-bff to call tax.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-tax
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: tax
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/order"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
---
# Allow storefront-bff to call search.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-storefront-bff-to-search
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: search
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
---
# Allow backoffice-bff and order to call inventory.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-inventory
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: inventory
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/order"
---
# Allow storefront-bff, backoffice-bff, and product to call media.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-media
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: media
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/product"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/cart"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/payment"
---
# Allow BFFs and customer service to call location for checkout addresses.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-location
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: location
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/backoffice-bff"
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/customer"
---
# Allow storefront-bff to call sampledata.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-storefront-bff-to-sampledata
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: sampledata
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/storefront-bff"
---

# Allow Kubernetes probes and Argo CD health checks.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-health-check
  namespace: {{ .Release.Namespace }}
spec:
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - "/actuator/health"
              - "/actuator/prometheus"
              - "/health"
              - "/"
---

# Allow Swagger UI host to load OpenAPI docs from backend services through ingressgateway.
{{- $swaggerDocsServices := list "product" "media" "customer" "cart" "order" "payment" "location" "inventory" "tax" "search" "sampledata" }}
{{- range $service := $swaggerDocsServices }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingressgateway-to-{{ $service }}-api-docs
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ $service }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            paths:
              - "/{{ $service }}/v3/api-docs"
              - "/{{ $service }}/v3/api-docs/*"
---
{{- end }}

# Default deny-all. Explicit ALLOW policies above define the permitted service graph.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: {{ .Release.Namespace }}
spec: {}
{{- end }}
