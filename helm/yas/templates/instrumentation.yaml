apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: yas-instrumentation
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: yas-instrumentation
spec:
  exporter:
    endpoint: http://opentelemetry-collector.observability:4318
  env:
    - name: OTEL_TRACES_EXPORTER
      value: otlp
    - name: OTEL_METRICS_EXPORTER
      value: none
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED
      value: "false"
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: always_on
