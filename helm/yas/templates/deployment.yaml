{{- range $serviceName, $serviceConfig := .Values }}
{{- if typeIs "map[string]interface {}" $serviceConfig }}
{{- if hasKey $serviceConfig "enabled" }}
{{- if hasKey $serviceConfig "image" }}
{{- if eq $serviceConfig.enabled true }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $serviceName }}
spec:
  replicas: 1
  {{- if $serviceConfig.strategy }}
  strategy:
    {{- toYaml $serviceConfig.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $serviceName }}
  template:
    metadata:
      labels:
        app: {{ $serviceName }}
      {{- if or $serviceConfig.podAnnotations $.Values.global.configRevision }}
      annotations:
        {{- if $.Values.global.configRevision }}
        rollout.yas.dev/config-revision: {{ $.Values.global.configRevision | quote }}
        {{- end }}
        {{- range $key, $val := $serviceConfig.podAnnotations }}
        {{ $key }}: {{ $val | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ $serviceName }}
      {{- if $serviceConfig.hostAliases }}
      hostAliases:
        {{- toYaml $serviceConfig.hostAliases | nindent 8 }}
      {{- end }}
      {{- if $serviceConfig.initContainers }}
      initContainers:
        {{- toYaml $serviceConfig.initContainers | nindent 8 }}
      {{- end }}
      {{- if or $serviceConfig.isBackend $serviceConfig.extraVolumes }}
      volumes:
        {{- if $serviceConfig.isBackend }}
        - name: yas-configuration
          configMap:
            name: yas-configuration-configmap
        {{- end }}
        {{- if $serviceConfig.extraVolumes }}
        {{- toYaml $serviceConfig.extraVolumes | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $serviceName }}
          image: "{{ $serviceConfig.image.repository }}:{{ $serviceConfig.image.tag }}"
          {{- if or (eq (toString $serviceConfig.image.tag) "main") (eq (toString $serviceConfig.image.tag) "latest") }}
          imagePullPolicy: Always
          {{- else }}
          imagePullPolicy: IfNotPresent
          {{- end }}
          {{- if $serviceConfig.service }}
          ports:
            - containerPort: {{ $serviceConfig.service.port }}
          {{- end }}
          {{- if $serviceConfig.isBackend }}
          volumeMounts:
            - mountPath: /opt/yas/config
              name: yas-configuration
          {{- end }}
          {{- if $serviceConfig.extraVolumeMounts }}
            {{- if not $serviceConfig.isBackend }}
          volumeMounts:
            {{- end }}
            {{- toYaml $serviceConfig.extraVolumeMounts | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $serviceConfig.resources | nindent 12 }}
          {{- if or $serviceConfig.env $serviceConfig.secrets $serviceConfig.isBackend }}
          envFrom:
            {{- if $serviceConfig.isBackend }}
            - secretRef:
                name: yas-postgresql-credentials-secret
            {{- end }}
            {{- if $serviceConfig.env }}
            - configMapRef:
                name: {{ $serviceName }}-config
            {{- end }}
            {{- if $serviceConfig.secrets }}
            - secretRef:
                name: {{ $serviceName }}-secret
            {{- end }}
          {{- end }}
          {{- if $serviceConfig.isBackend }}
          env:
            - name: LOGGING_CONFIG
              value: /opt/yas/config/logback.xml
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql.postgres:5432/{{ $serviceName }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: /opt/yas/config/application.yaml
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
