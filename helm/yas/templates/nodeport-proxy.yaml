{{- if and .Values.nodePortWeb .Values.nodePortWeb.enabled }}
{{- range $name, $cfg := .Values.nodePortWeb.apps }}
{{- if $cfg.enabled }}
{{- $source := index $.Values $cfg.sourceService }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
data:
  default.conf: |
    server {
      listen {{ $cfg.proxyPort }};
      server_name _;

      proxy_http_version 1.1;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

{{- range $route := $cfg.routes }}
      location ^~ {{ $route.path }} {
        proxy_set_header Host {{ $route.host }};
        proxy_pass {{ $route.target }};
      }

{{- end }}
      location / {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:{{ $cfg.appPort }};
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        sidecar.istio.io/inject: "false"
        rollout.yas.dev/nodeport-proxy: {{ $.Values.nodePortWeb.configRevision | default "v1" | quote }}
    spec:
      containers:
        - name: {{ $cfg.sourceService }}
          image: "{{ $source.image.repository }}:{{ $source.image.tag }}"
          {{- if or (eq (toString $source.image.tag) "main") (eq (toString $source.image.tag) "latest") }}
          imagePullPolicy: Always
          {{- else }}
          imagePullPolicy: IfNotPresent
          {{- end }}
          ports:
            - containerPort: {{ $cfg.appPort }}
          {{- if or $source.env $cfg.env }}
          envFrom:
            {{- if $source.env }}
            - configMapRef:
                name: {{ $cfg.sourceService }}-config
            {{- end }}
          {{- end }}
          {{- if $cfg.env }}
          env:
            {{- range $key, $value := $cfg.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if $source.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml $source.extraVolumeMounts | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $source.resources | nindent 12 }}
        - name: nodeport-proxy
          image: {{ $cfg.image | default "nginxinc/nginx-unprivileged:1.27-alpine" | quote }}
          ports:
            - containerPort: {{ $cfg.proxyPort }}
          volumeMounts:
            - name: nodeport-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: nodeport-proxy-config
          configMap:
            name: {{ $name }}-config
        {{- if $source.extraVolumes }}
        {{- toYaml $source.extraVolumes | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app: {{ $name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ $cfg.proxyPort }}
      targetPort: {{ $cfg.proxyPort }}
      nodePort: {{ $cfg.nodePort }}
{{- end }}
{{- end }}
{{- end }}
