apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yas-dev-services
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: yas-configuration
          - service: cart
          - service: tax
          - service: order
          - service: product
          - service: media
          - service: customer
          - service: inventory
          - service: search
          - service: sampledata
          - service: backoffice-bff
          - service: storefront-bff
          - service: backoffice-ui
          - service: storefront-ui
          - service: swagger-ui
  template:
    metadata:
      name: yas-dev-{{service}}
      labels:
        app.kubernetes.io/part-of: yas-dev
    spec:
      project: default
      source:
        repoURL: https://github.com/thu2005/gitops-yas.git
        targetRevision: HEAD
        path: charts/{{service}}
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - ../../environments/dev/values-shared.yaml
            - ../../environments/dev/services/{{service}}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: yas-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-dev-istio-configs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thu2005/gitops-yas.git
    targetRevision: HEAD
    path: infrastructure/istio-configs
    helm:
      parameters:
        - name: namespace
          value: yas-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: yas-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
