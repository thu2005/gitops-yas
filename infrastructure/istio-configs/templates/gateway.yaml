apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: yas-gateway
  namespace: {{ .Values.namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.hosts.api | quote }}
        - {{ .Values.hosts.storefront | quote }}
        - {{ .Values.hosts.backoffice | quote }}
        - {{ .Values.hosts.keycloak | quote }}
